<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Panda & Bear Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bear-brown: #a67c52;
            --panda-black: #333;
            --pastel-pink: #ffc1cc;
            --pastel-blue: #b2e2f2;
            --pastel-green: #b2f2bb;
            --cream: #fff9ed;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--cream);
            /* Aggiornamento: Sfondo personalizzato con pattern di animali kawaii */
            background-image: url('image_0.png');
            background-size: 200px 200px; /* Regola la dimensione del pattern se necessario */
            background-repeat: repeat; /* Il pattern si ripeterà senza interruzioni */
            background-position: top left;
            margin: 0;
            padding: 20px;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Decorazioni Animaletti --- */
        .mascot-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 10px;
        }

        .animal {
            font-size: 80px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
            user-select: none;
        }

        .animal:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* --- Header & Nav --- */
        header {
            text-align: center;
            background: var(--white);
            padding: 20px 40px;
            border-radius: 40px;
            box-shadow: 0 10px 0 var(--pastel-pink);
            margin-bottom: 40px;
            border: 4px solid var(--panda-black);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            margin: 0 0 20px 0;
            color: var(--bear-brown);
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px var(--pastel-pink);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-btn {
            background: var(--white);
            border: 3px solid var(--panda-black);
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 0 var(--panda-black);
        }

        .nav-btn.active {
            background: var(--pastel-pink);
            color: white;
            box-shadow: 0 5px 0 var(--panda-black);
        }

        /* --- Area Contenuto --- */
        #main-content {
            width: 100%;
            max-width: 1200px;
            min-height: 500px;
        }

        /* --- Card & Griglie --- */
        .card {
            background: var(--white);
            border-radius: 30px;
            border: 4px solid var(--panda-black);
            padding: 25px;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .view-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--pastel-pink);
            padding-bottom: 10px;
        }

        /* --- Vista Settimanale --- */
        .grid-week {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .day-box {
            background: var(--white);
            border: 3px solid var(--panda-black);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .day-label {
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--panda-black);
        }

        /* --- Input e Liste --- */
        .entry-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-tag {
            background: var(--pastel-blue);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
            min-width: 60px;
            text-align: center;
            border: 2px solid var(--panda-black);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            border: 2px solid var(--panda-black);
            border-radius: 15px;
            padding: 8px 12px;
            flex-grow: 1;
            outline: none;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            background: #fff;
            box-shadow: 0 0 5px var(--pastel-pink);
        }

        input[type="color"] {
            border: 2px solid var(--panda-black);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* --- Vista Mese --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .cal-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: var(--pastel-green);
            border-radius: 12px;
            border: 2px solid var(--panda-black);
            font-size: 0.9rem;
        }

        .cal-day {
            min-height: 110px;
            border: 2px solid var(--panda-black);
            border-radius: 18px;
            padding: 8px;
            background: var(--white);
            display: flex;
            flex-direction: column;
        }

        .cal-day strong {
            font-size: 1rem;
            margin-bottom: 5px;
            color: var(--panda-black);
        }

        .cal-day textarea {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        /* --- Vista Anno --- */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .month-bubble {
            background: var(--white);
            border: 3px solid var(--panda-black);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            text-align: center;
        }

        .month-bubble strong {
            font-size: 1.2rem;
            color: var(--bear-brown);
            display: inline-block;
            margin-bottom: 8px;
        }

        /* --- Footer --- */
        footer {
            margin-top: 50px;
            font-weight: bold;
            color: var(--bear-brown);
            text-align: center;
        }

        .cute-bg-elements {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 120px;
            opacity: 0.08;
            z-index: -1;
            pointer-events: none;
            user-select: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .cal-header {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="mascot-container">
        <div class="animal">🐻</div>
        <div class="animal">🐼</div>
        <div class="animal">🐨</div>
    </div>

    <header>
        <h1>Il Mio Cute Planner</h1>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="changeView('day')" id="btn-day">
                <i class="fas fa-sun"></i> Giorno
            </button>
            <button class="nav-btn active" onclick="changeView('week')" id="btn-week">
                <i class="fas fa-calendar-week"></i> Settimana
            </button>
            <button class="nav-btn" onclick="changeView('month')" id="btn-month">
                <i class="fas fa-calendar-alt"></i> Mese
            </button>
            <button class="nav-btn" onclick="changeView('year')" id="btn-year">
                <i class="fas fa-star"></i> Anno
            </button>
        </div>
    </header>

    <div id="main-content"></div>

    <div class="cute-bg-elements">🐼</div>

    <footer>Creato con ❤️ per una giornata super organizzata!</footer>

    <script>
        let currentView = 'week';
        const days = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
        const months = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
        
        // Carica i dati precedentemente salvati o ne crea uno spazio vuoto
        let plannerData = JSON.parse(localStorage.getItem('kawaiiPlannerData')) || {};

        function changeView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + view).classList.add('active');
            render();
        }

        function saveData(id, val) {
            plannerData[id] = val;
            localStorage.setItem('kawaiiPlannerData', JSON.stringify(plannerData));
        }

        function saveColor(id, color) {
            plannerData[id + '_color'] = color;
            localStorage.setItem('kawaiiPlannerData', JSON.stringify(plannerData));
            const element = document.getElementById(id);
            if (element) {
                element.style.backgroundColor = color;
            }
        }

        function render() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if (currentView === 'day') {
                renderDay(container);
            } else if (currentView === 'week') {
                renderWeek(container);
            } else if (currentView === 'month') {
                renderMonth(container);
            } else if (currentView === 'year') {
                renderYear(container);
            }
        }

        // --- VISTA GIORNO ---
        function renderDay(container) {
            let html = `
                <div class="card">
                    <div class="view-title"><h2>Programma di Oggi</h2> <div style="font-size:2rem">🕒</div></div>
                    <div class="hours-list">`;
            
            // Ciclo per generare le ore del giorno dalle 07:00 alle 21:00
            for (let i = 7; i <= 21; i++) {
                let time = (i < 10 ? '0' + i : i) + ':00';
                let id = 'day_hour_' + time;
                html += `
                    <div class="entry-row">
                        <span class="time-tag">${time}</span>
                        <input type="text" placeholder="Scrivi qui i tuoi programmi..." value="${plannerData[id] || ''}" oninput="saveData('${id}', this.value)">
                    </div>`;
            }
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // --- VISTA SETTIMANA ---
        function renderWeek(container) {
            let html = `<div class="grid-week">`;
            days.forEach(day => {
                let color = plannerData[day + '_color'] || '#ffffff';
                html += `
                <div class="day-box" id="${day}" style="background-color: ${color}">
                    <div class="day-label">
                        <span>${day}</span>
                        <input type="color" value="${color}" onchange="saveColor('${day}', this.value)">
                    </div>
                    <div class="task-list">
                        <div class="entry-row"><span class="time-tag">Mattina</span><input type="text" placeholder="Task..." value="${plannerData[day+'_morning'] || ''}" oninput="saveData('${day}_morning', this.value)"></div>
                        <div class="entry-row"><span class="time-tag">Pomeriggio</span><input type="text" placeholder="Task..." value="${plannerData[day+'_afternoon'] || ''}" oninput="saveData('${day}_afternoon', this.value)"></div>
                        <div class="entry-row"><span class="time-tag">Sera</span><input type="text" placeholder="Task..." value="${plannerData[day+'_evening'] || ''}" oninput="saveData('${day}_evening', this.value)"></div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // --- VISTA MESE ---
        function renderMonth(container) {
            let html = `
                <div class="card">
                    <div class="view-title"><h2>📅 Agenda Mensile</h2> <div style="font-size:2rem">🍃</div></div>
                    <div class="calendar-grid">
                        <div class="cal-header">Lun</div><div class="cal-header">Mar</div><div class="cal-header">Mer</div>
                        <div class="cal-header">Gio</div><div class="cal-header">Ven</div><div class="cal-header">Sab</div><div class="cal-header">Dom</div>`;
            
            // Genera una griglia standard di 31 giorni
            for (let i = 1; i <= 31; i++) {
                let id = 'month_day_' + i;
                html += `
                    <div class="cal-day">
                        <strong>${i}</strong>
                        <textarea placeholder="Nota rapida..." oninput="saveData('${id}', this.value)">${plannerData[id] || ''}</textarea>
                    </div>`;
            }
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // --- VISTA ANNO ---
        function renderYear(container) {
            let html = `
                <div class="card">
                    <div class="view-title"><h2>⭐️ Grandi Obiettivi dell'Anno</h2> <div style="font-size:2rem">🚀</div></div>
                    <div class="year-grid">`;
            
            months.forEach(m => {
                let id = 'year_month_' + m;
                html += `
                    <div class="month-bubble">
                        <strong>${m}</strong>
                        <input type="text" placeholder="Focus del mese..." value="${plannerData[id] || ''}" oninput="saveData('${id}', this.value)" style="width:100%; margin-top:5px;">
                    </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // Carica la vista iniziale all'avvio
        render();
    </script>
</body>
</html>
