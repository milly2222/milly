<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Planner</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-default: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Griglia della Settimana */
        .week-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Casella del Giorno */
        .day-card {
            background-color: var(--card-default);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .day-title {
            margin: 0;
            font-size: 1.2rem;
            text-transform: capitalize;
        }

        /* Color Picker */
        .color-picker-wrapper {
            position: relative;
            display: inline-block;
        }

        .color-picker-wrapper input[type="color"] {
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        /* Ore e Impegni */
        .hours-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .hour-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hour-label {
            font-size: 0.9rem;
            font-weight: bold;
            min-width: 45px;
            color: #666;
        }

        .task-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px;
            font-size: 0.9rem;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .task-input:focus {
            outline: 2px solid #007bff;
            background-color: #fff;
        }
    </style>
</head>
